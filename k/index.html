<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#122324">
<title>FMJ Apps</title>
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  *{box-sizing:border-box;margin:0}
  :root{--ease:cubic-bezier(.2,.7,.2,1);--px:50%;--py:30%}
  body{min-height:100vh;background:#122324;color:#fff;font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:32px 16px;overflow-x:hidden;position:relative}

  /* Arka plan: yavaş akan ışık kümeleri, imleci izleyen ışık, ince nokta ağı */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:0}
  .bg .a{width:420px;height:420px;left:-120px;top:-100px;background:#376E6F;animation:in 1.8s .1s forwards,drift1 16s ease-in-out infinite alternate}
  .bg .b{width:360px;height:360px;right:-140px;bottom:-80px;background:#FF4F2E;animation:in2 1.8s .3s forwards,drift2 19s ease-in-out infinite alternate}
  .bg .c{width:520px;height:520px;left:var(--px);top:var(--py);margin:-260px 0 0 -260px;background:radial-gradient(circle,rgba(95,163,163,.35),transparent 65%);filter:blur(30px);opacity:1;transition:left .5s var(--ease),top .5s var(--ease)}
  .bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(circle at 50% 35%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 35%,#000,transparent 75%)}
  @keyframes in{to{opacity:.55}}
  @keyframes in2{to{opacity:.28}}
  @keyframes drift1{to{transform:translate(90px,120px) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-110px,-90px) scale(1.2)}}

  main{width:100%;max-width:420px;text-align:center;position:relative;z-index:1}

  /* Açılış: logo odaklanarak belirir, arkasında halkalar yayılır, üstünden ışık geçer */
  .logo-wrap{position:relative;width:230px;max-width:80%;margin:8px auto 16px}
  .logo{width:100%;height:auto;display:block;opacity:0;transform:scale(1.35);filter:blur(14px);animation:logoIn 1.3s .15s var(--ease) forwards}
  @keyframes logoIn{60%{filter:blur(0)}to{opacity:1;transform:scale(1);filter:blur(0)}}
  .ring{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:1.5px solid rgba(255,79,46,.7);opacity:0;animation:ring 2.2s .5s var(--ease) 1}
  .ring.r2{animation-delay:.8s;border-color:rgba(95,163,163,.7)}
  @keyframes ring{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(7)}}

  .slogan{font-family:Sora,Inter,sans-serif;color:#C9D3D8;font-size:1rem;opacity:0;letter-spacing:.22em;animation:slog 1.4s .9s var(--ease) forwards}
  @keyframes slog{to{opacity:1;letter-spacing:.01em}}
  .tanitim{color:#93A6AE;font-size:.95rem;line-height:1.5;margin:18px 0 26px;opacity:0;transform:translateY(10px);animation:rise .8s 1.3s var(--ease) forwards}

  .btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;padding:15px 18px;margin-top:12px;border-radius:14px;font-weight:600;font-size:1rem;text-decoration:none;color:#fff;background:rgba(36,64,63,.75);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);opacity:0;transform:translateY(24px) scale(.97);animation:rise .7s calc(1.5s + var(--i) * .11s) var(--ease) forwards;transition:border-color .25s,box-shadow .25s,transform .25s var(--ease)}
  .btn.ana{background:#FF4F2E;border-color:#FF4F2E}
  @keyframes rise{to{opacity:1;transform:none}}
  /* İmleç / parmak ışığı */
  .btn:before{content:"";position:absolute;inset:0;background:radial-gradient(160px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 60%);opacity:0;transition:opacity .25s}
  .btn:hover:before,.btn.on:before{opacity:1}
  .btn:hover{border-color:rgba(255,255,255,.35);box-shadow:0 10px 30px -12px rgba(0,0,0,.7);transform:translateY(-2px)}
  .btn:active{transform:scale(.97)}
  /* Dokununca dalga */
  .btn .dalga{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);width:20px;height:20px;margin:-10px 0 0 -10px;transform:scale(0);animation:dalga .6s ease-out forwards;pointer-events:none}
  @keyframes dalga{to{transform:scale(22);opacity:0}}
  /* Ana butonda süzülen parlama */
  .btn.ana:after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sweep 3.6s 3s ease-in-out infinite}
  @keyframes sweep{0%{left:-80px}35%,100%{left:120%}}
  .btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;position:absolute;left:18px;transition:transform .3s var(--ease)}
  .btn svg.fill{fill:currentColor;stroke:none}
  .btn:hover svg{transform:scale(1.18) rotate(-6deg)}

  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation:none!important;transition:none!important}
    .logo,.slogan,.tanitim,.btn{opacity:1;transform:none;filter:none;letter-spacing:.01em}
    .bg .a{opacity:.5}.bg .b{opacity:.25}.ring{display:none}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<main>
  <div class="logo-wrap"><img class="logo" src="/assets/brand/logo-koyu-zemin.svg" alt="FMJ Apps"><span class="ring"></span><span class="ring r2"></span></div>
  <p class="slogan">Güvenilir çözümler, verimli sonuçlar</p>
  <p class="tanitim">İşletmeniz için çözümler üretiyoruz: mesajlarınıza 7/24 cevap veren yapay zekâ asistanı, QR menü ve web siteleri.</p>

  <a class="btn" style="--i:2" href="https://www.instagram.com/fmjapps"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/></svg>Instagram</a>
  <a class="btn" style="--i:3" href="mailto:contact@fmjapps.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7.5 8 6 8-6"/></svg>E-posta</a>
  <a class="btn" style="--i:4" href="https://fmjapps.com"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5S9.6 5.9 12 3.5Z"/></svg>Web sitemiz</a>
  <a class="btn" style="--i:5" href="tel:+905333181555"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Bizi arayın</a>
</main>
<script src="/k/k.js"></script>
</body>
</html>
